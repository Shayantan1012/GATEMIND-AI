name: Deploy Backend to EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/gatemind
          chmod 600 ~/.ssh/gatemind
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Package backend
        run: tar --exclude='backend/uploads' --exclude='backend/.env' -czf backend.tar.gz backend

      - name: Upload and restart on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          scp -i ~/.ssh/gatemind backend.tar.gz "$EC2_USER@$EC2_HOST:/tmp/backend.tar.gz"
          ssh -i ~/.ssh/gatemind "$EC2_USER@$EC2_HOST" '
            set -e
            sudo mkdir -p /opt/gatemind/source /opt/gatemind/uploads
            sudo rm -rf /opt/gatemind/source/backend
            sudo tar -xzf /tmp/backend.tar.gz -C /opt/gatemind/source
            cd /opt/gatemind/source/backend
            sudo docker compose -f docker-compose.prod.yml up -d --build
            rm -f /tmp/backend.tar.gz
          '

      - name: Check backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: curl --fail "http://$EC2_HOST/api/health"
