name: Deploy Backend to EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/gatemind
          chmod 600 ~/.ssh/gatemind
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Package backend
        run: tar --exclude='backend/uploads' --exclude='backend/.env' -czf backend.tar.gz backend

      - name: Upload backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: scp -i ~/.ssh/gatemind backend.tar.gz "$EC2_USER@$EC2_HOST:/tmp/backend.tar.gz"

      - name: Deploy backend container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh -i ~/.ssh/gatemind "$EC2_USER@$EC2_HOST" '
            set -e
            sudo mkdir -p /opt/gatemind/source /opt/gatemind/uploads
            sudo rm -rf /opt/gatemind/source/backend
            sudo tar -xzf /tmp/backend.tar.gz -C /opt/gatemind/source
            sudo chown -R 999:999 /opt/gatemind/uploads
            cd /opt/gatemind/source/backend
            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            sudo docker image prune -f
            rm -f /tmp/backend.tar.gz
          '

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent "http://$EC2_HOST/api/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
