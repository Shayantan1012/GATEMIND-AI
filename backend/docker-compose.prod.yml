services:
  backend:
    container_name: gatemind-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/gatemind/backend.env
    environment:
      PORT: "5000"
      GUNICORN_WORKERS: "1"
      GUNICORN_TIMEOUT: "300"
    ports:
      - "80:5000"
    volumes:
      - /opt/gatemind/uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
